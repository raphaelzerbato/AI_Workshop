
base_model:
  test_size: 0.2
  random_state: 42

cv_lasso:
  cv: 10
  max_iter: 5000
  random_state_lasso: 52
  n_jobs: 1

xgboost:
  use_label_encoder: false
  eval_metric: logloss
  n_estimators: 100
  learning_rate: 0.1
  max_depth: 6
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

lightgbm:
  n_estimators: 100
  learning_rate: 0.1
  max_depth: -1
  num_leaves: 31
  subsample: 0.8
  colsample_bytree: 0.8
  random_state: 42

randomforest:
  n_estimators: 100
  max_depth: None
  min_samples_split: 2
  min_samples_leaf: 1
  bootstrap: true
  random_state: 42

catboost:
  iterations: 100
  learning_rate: 0.1
  depth: 6
  l2_leaf_reg: 3
  loss_function: Logloss
  verbose: 0
  random_seed: 42
  
